[package]
name = "fox2wolf"
version = "0.1.0"
edition = "2021"
description = "Firefox to LibreWolf history migration tool"
license = "GPL-3.0-only"
repository = "https://github.com/lfstartwq/fox2wolf"
readme = "README.md"
categories = ["command-line-utilities", "database"]
keywords = ["firefox", "librewolf", "history", "migration", "places.sqlite"]

[dependencies]
rusqlite = { version = "0.31", features = ["bundled", "modern_sqlite", "extra_check"] }
directories-next = "2.0"
clap = { version = "4.5", features = ["derive", "help", "env"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
crc32fast = "1.3"  # URL hash computation
indicatif = "0.17"  # progress bar
parking_lot = "0.12"  # faster mutex
toml = "0.8"  # profiles.ini parsing

[dev-dependencies]
tempfile = "3.10"
predicates = "3.0"

[[bin]]
name = "fox2wolf"
path = "src/main.rs"

[profile.release]
lto = true
opt-level = 3
strip = true
panic = "abort"
codegen-units = 1

[workspace]